# compose.dev.yaml — 開発環境専用
#
# redmine Redmine スタック用の Docker Compose 定義です。
#
# 本番 (RHEL 9.5+) もこのファイルを使い、compose.prod.yaml を重ねて systemd
# (systemd/redmine.service) から起動します:
#   docker compose -f compose.dev.yaml -f compose.prod.yaml up -d --wait
# 本番との差分は compose.prod.yaml 側の 2 点だけです
#   - データ: 名前付きボリューム → /opt/redmine/data 配下の bind mount
#   - 公開ポート: 127.0.0.1:8080 → 127.0.0.1:80
# つまりイメージ・環境変数・シークレット・ヘルスチェックは開発と本番で完全に同一です
# （このファイルが唯一の定義元です）。開発はホスト準備なしで動くよう、名前付き
# ボリュームと非特権ポート 8080 を既定にしています。
#
# 使い方:
#   bash scripts/generate-secrets.sh          # ./secrets/*.txt を生成
#   docker compose -f compose.dev.yaml up --build -d
#   http://localhost:8080/redmine/ を開く

# プロジェクト名は COMPOSE_PROJECT_NAME (.env) で上書きしてください。COMPOSE_PROJECT_NAME
# は Compose 仕様上 name: よりも優先され、.env から直接読まれるため、ここでの変数展開は
# 使いません — podman-compose 1.5.0 はこの name: フィールドをプロジェクト名解決より前に
# (env 未展開のまま) 正規化してしまい、"${STACK_NAME:-redmine}" が不正なプロジェクト名
# "_-redmine" になって volume 作成が失敗するバグがあります (scripts/test-stack.sh 参照)。
name: redmine

# ── podman-compose で pod を作らせない設定 (issue #44) ────────────────────────
# podman-compose は既定で「プロジェクト名の pod」を作り、その中に全コンテナを
# 入れます。rootless + systemd 環境ではこの pod 用 cgroup (slice) の作成に失敗し、
# 次のエラーで起動できないことがあります:
#   Error: unable to start container "...": unable to create pod cgroup for pod ...:
#   creating cgroup .../user-libpod_pod_<id>.slice:
#   Unit user-libpod_pod_<id>.slice was already loaded or has a fragment file.
# このスタックは pod を必要としません（コンテナ間は redmine-net で名前解決し、
# 公開ポートは redmine-web だけ）。そのため pod を使わない設定にします。
#
# ★ x-podman は podman-compose (1.5.0 以降で in_pod をサポート) だけが読む拡張キーです。
#   Docker Compose は仕様上 `x-` 接頭辞のトップレベルキーを無視するため、
#   docker 側の挙動は一切変わりません。
#   CLI で上書きする場合は `podman-compose --in-pod false ...`、
#   環境変数なら PODMAN_COMPOSE_IN_POD=false です。
x-podman:
  in_pod: false

networks:
  redmine-net:
    name: ${REDMINE_NETWORK:-redmine-net}
    driver: bridge

volumes:
  pgdata:
    name: ${REDMINE_DB_VOLUME:-redmine_pgdata}
  redmine_files:
    name: ${REDMINE_FILES_VOLUME:-redmine_web_files}

secrets:
  db_password:
    file: ./secrets/db_password.txt
  secret_key_base:
    file: ./secrets/secret_key_base.txt

services:
  # ── PostgreSQL 18 + PostGIS 3.6 ──────────────────────────────────────────────
  redmine-db:
    build:
      context: containers/redmine-db
      dockerfile: Containerfile
      args:
        DB_BASE_IMAGE: ${REDMINE_DB_BASE_IMAGE:-docker.io/postgis/postgis:18-3.6}
        # ── プロキシ環境用（社内プロキシ経由でビルドする場合） ──────────────
        # HTTP_PROXY / HTTPS_PROXY / NO_PROXY は docker の predefined build args
        # なので、Containerfile 側に ARG 宣言は不要です。ビルド中の apt-get /
        # git clone / bundle install がこの値を見ます。
        # 未設定なら空文字になり、docker が build arg ごと落とすため
        # （= コンテナ内でも未設定になる）プロキシ無し環境に影響はありません。
        # 値は .env で設定します（docs/Setup.md「プロキシ環境で使う場合」参照）。
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: ${REDMINE_DB_IMAGE:-localhost/redmine-db:18-3.6}
    container_name: ${REDMINE_DB_CONTAINER:-redmine-db}
    restart: always
    networks:
      - redmine-net
    # ポート 5432 は意図的にホストへ公開しません。
    environment:
      POSTGRES_DB: ${REDMINE_DB_NAME:-redmine}
      POSTGRES_USER: ${REDMINE_DB_USER:-redmine}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REDMINE_DB_USER:-redmine} -h localhost -p ${REDMINE_DB_PORT:-5432} -d ${REDMINE_DB_NAME:-redmine} -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redmine + Apache 2.4 frontend (port 80 / Passenger or Puma :3000) ──────
  # 既定は Redmine 7 系（Containerfile.v7 / redmine:7.0.1）です。5 系・6 系へ
  # 切り替えるときは .env で REDMINE_WEB_CONTAINERFILE / REDMINE_VERSION（=
  # REDMINE_WEB_BASE_IMAGE, REDMINE_WEB_IMAGE）を 3 つセットで変更します
  # （.env.example のプリセットと docs/Design.md「Redmine シリーズの切り替え」参照）。
  # シリーズは一度に 1 つだけ起動する前提です（コンテナ名・ポート・ボリュームは共通）。
  redmine-web:
    build:
      context: containers/redmine-web
      dockerfile: ${REDMINE_WEB_CONTAINERFILE:-Containerfile.v7}
      args:
        WEB_BASE_IMAGE: ${REDMINE_WEB_BASE_IMAGE:-docker.io/library/redmine:7.0.1}
        # ── プロキシ環境用（社内プロキシ経由でビルドする場合） ──────────────
        # HTTP_PROXY / HTTPS_PROXY / NO_PROXY は docker の predefined build args
        # なので、Containerfile 側に ARG 宣言は不要です。ビルド中の apt-get /
        # git clone / bundle install がこの値を見ます。
        # 未設定なら空文字になり、docker が build arg ごと落とすため
        # （= コンテナ内でも未設定になる）プロキシ無し環境に影響はありません。
        # 値は .env で設定します（docs/Setup.md「プロキシ環境で使う場合」参照）。
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: ${REDMINE_WEB_IMAGE:-localhost/redmine-web:7.0.1}
    container_name: ${REDMINE_WEB_CONTAINER:-redmine-web}
    restart: always
    networks:
      - redmine-net
    ports:
      # ループバックのみ、非特権ポート 8080 で公開します。rootless Podman や
      # rootless Docker は特権ポート (<1024) への bind に CAP_NET_BIND_SERVICE
      # ないし net.ipv4.ip_unprivileged_port_start の変更を要求するため、ホスト
      # 準備なしで動く開発環境ではホスト側を 8080 にマッピングします
      # (本番は compose.prod.yaml が 127.0.0.1:80 へ差し替えます)。
      - "${REDMINE_WEB_BIND_HOST:-127.0.0.1}:${REDMINE_WEB_HOST_PORT:-8080}:${REDMINE_WEB_CONTAINER_PORT:-80}"
    depends_on:
      redmine-db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_RELATIVE_URL_ROOT: ${REDMINE_SUBURI:-/redmine}
      TZ: ${TZ:-Asia/Tokyo}
      RUBY_YJIT_ENABLE: ${RUBY_YJIT_ENABLE:-1}
      # passenger (既定) = Apache + mod_passenger が直接起動（:3000 なし）/
      # puma             = Apache -> ProxyPass -> Puma :3000。
      # イメージには両方同梱してあるため、再起動のみで切り替わります。
      # 既定値はこのファイルの他の既定と同じく 7 系のもの（= Containerfile.v7 の
      # ENV REDMINE_WEB_SERVER）に合わせてあります。5 系 / 6 系のイメージ既定は
      # puma なので、それらへ切り替えるときは .env で明示してください。
      REDMINE_WEB_SERVER: ${REDMINE_WEB_SERVER:-passenger}
      REDMINE_PUMA_PORT: ${REDMINE_PUMA_PORT:-3000}
      # このスタックは常に postgis です。移行元のバージョン/プラグイン構成の
      # まま DB だけ PostgreSQL へ恒久的に切り替える場合は、こちらではなく
      # compose.legacy.yaml + compose.legacy-on-postgres.yaml を使います
      # （docs/Upgrade.md §4.1 — .env と .env.legacy を混在させない設計のため）。
      REDMINE_DB_ADAPTER: postgis
      REDMINE_DB_HOST: ${REDMINE_DB_CONTAINER:-redmine-db}
      REDMINE_DB_NAME: ${REDMINE_DB_NAME:-redmine}
      REDMINE_DB_USER: ${REDMINE_DB_USER:-redmine}
      REDMINE_DB_PASSWORD_FILE: /run/secrets/db_password
      REDMINE_SECRET_KEY_BASE_FILE: /run/secrets/secret_key_base
      REDMINE_PLUGINS_MIGRATE: "1"
      # 公式イメージ同様、値を設定するとコアの db:migrate をスキップします
      # （既定は未設定 = 起動時にマイグレーションを実行）。
      # REDMINE_NO_DB_MIGRATE: "1"
      # 初回起動時（roles テーブルが空）のみ、日本語の既定データを投入します。
      REDMINE_LOAD_DEFAULT_DATA: "1"
      REDMINE_DEFAULT_DATA_LANG: ja
    secrets:
      - db_password
      - secret_key_base
    volumes:
      - redmine_files:/usr/src/redmine/files
    healthcheck:
      # 判定ロジックはイメージ内のスクリプトに置いています。サブ URI や
      # REDMINE_WEB_SERVER をコンテナの環境変数から解決するため、compose 側は
      # モードを気にせず同じ 1 コマンドを呼ぶだけで済みます。
      test: ["CMD", "/usr/local/bin/redmine-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
