# compose.dev.yaml — DEVELOPMENT ONLY
#
# Docker Compose definition for the hwins Redmine stack. It mirrors the
# production Podman Quadlet units in quadlets/ (same images, environment,
# secrets and health checks) but uses named volumes instead of /opt/hwins host
# bind-mounts so it runs without host preparation.
#
# Production deployment does NOT use this file — it uses Podman + systemd
# Quadlets as described in docs/Setup.md.
#
# Usage:
#   bash scripts/generate-secrets.sh          # creates ./secrets/*.txt
#   docker compose -f compose.dev.yaml up --build -d
#   open http://localhost:18080/redmine/      # (or via host Apache: http://localhost/redmine/)

name: hwins

networks:
  hwins-net:
    name: hwins-net
    driver: bridge

volumes:
  pgdata:
  hwins_files:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  secret_key_base:
    file: ./secrets/secret_key_base.txt

services:
  # ── PostgreSQL 18 + PostGIS 3.6 ──────────────────────────────────────────────
  hwins-db:
    build:
      context: containers/hwins-db
      dockerfile: Containerfile
    image: localhost/hwins-db:18-3.6
    container_name: hwins-db
    restart: always
    networks:
      - hwins-net
    # Port 5432 is deliberately NOT published to the host.
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redmine 6.1.3 + plugin stack (Puma :3000) ────────────────────────────────
  hwins-redmine:
    build:
      context: containers/hwins-redmine
      dockerfile: Containerfile
    image: localhost/hwins-redmine:6.1.3
    container_name: hwins-redmine
    restart: always
    networks:
      - hwins-net
    # Puma port 3000 is NOT published to the host; only hwins-static reaches it.
    depends_on:
      hwins-db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_RELATIVE_URL_ROOT: /redmine
      TZ: Asia/Tokyo
      REDMINE_DB_HOST: hwins-db
      REDMINE_DB_NAME: redmine
      REDMINE_DB_USER: redmine
      REDMINE_DB_PASSWORD_FILE: /run/secrets/db_password
      REDMINE_SECRET_KEY_BASE_FILE: /run/secrets/secret_key_base
      REDMINE_PLUGINS_MIGRATE: "1"
    secrets:
      - db_password
      - secret_key_base
    volumes:
      - hwins_files:/usr/src/redmine/files
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:3000/redmine/login > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ── Apache httpd 2.4 reverse proxy (published web tier) ──────────────────────
  hwins-static:
    build:
      context: containers/hwins-static
      dockerfile: Containerfile
    image: localhost/hwins-static:2.4
    container_name: hwins-static
    restart: always
    networks:
      - hwins-net
    depends_on:
      hwins-redmine:
        condition: service_healthy
    ports:
      # Published on loopback only; a host Apache proxies :80/redmine → here.
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
