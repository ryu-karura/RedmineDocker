# compose.dev.yaml — 開発環境専用
#
# redmine Redmine スタック用の Docker Compose 定義です。production の Podman Quadlet
# ユニット (quadlets/) と同じイメージ・環境変数・シークレット・ヘルスチェックを使いますが、
# /opt/redmine のホスト bind-mount ではなく名前付きボリュームを使うため、ホスト準備なしで
# 実行できます。
#
# 本番デプロイではこのファイルは使用せず、docs/Setup.md で説明する Podman + systemd
# Quadlets を使います。
#
# 使い方:
#   bash scripts/generate-secrets.sh          # ./secrets/*.txt を生成
#   docker compose -f compose.dev.yaml up --build -d
#   http://localhost:8080/redmine/ を開く

name: ${STACK_NAME:-redmine}

networks:
  redmine-net:
    name: ${REDMINE_NETWORK:-redmine-net}
    driver: bridge

volumes:
  pgdata:
  redmine_files:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  secret_key_base:
    file: ./secrets/secret_key_base.txt

services:
  # ── PostgreSQL 18 + PostGIS 3.6 ──────────────────────────────────────────────
  redmine-db:
    build:
      context: containers/redmine-db
      dockerfile: Containerfile
      args:
        DB_BASE_IMAGE: ${REDMINE_DB_BASE_IMAGE:-docker.io/postgis/postgis:18-3.6}
    image: ${REDMINE_DB_IMAGE:-localhost/redmine-db:18-3.6}
    container_name: ${REDMINE_DB_CONTAINER:-redmine-db}
    restart: always
    networks:
      - redmine-net
    # ポート 5432 は意図的にホストへ公開しません。
    environment:
      POSTGRES_DB: ${REDMINE_DB_NAME:-redmine}
      POSTGRES_USER: ${REDMINE_DB_USER:-redmine}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REDMINE_DB_USER:-redmine} -h localhost -p ${REDMINE_DB_PORT:-5432} -d ${REDMINE_DB_NAME:-redmine} -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redmine 6.1.3 + Apache 2.4 frontend (port 80 / :3000) ─────────────────
  redmine-web:
    build:
      context: containers/redmine-web
      dockerfile: Containerfile
      args:
        WEB_BASE_IMAGE: ${REDMINE_WEB_BASE_IMAGE:-docker.io/library/redmine:6.1.3}
    image: ${REDMINE_WEB_IMAGE:-localhost/redmine-web:6.1.3}
    container_name: ${REDMINE_WEB_CONTAINER:-redmine-web}
    restart: always
    networks:
      - redmine-net
    ports:
      # ループバックのみ、非特権ポート 8080 で公開します。rootless Podman は
      # 特権ポート (<1024) への bind に CAP_NET_BIND_SERVICE ないし
      # net.ipv4.ip_unprivileged_port_start の変更を要求するため、ホスト準備
      # なしで動く開発環境ではホスト側を 8080 にマッピングします
      # (本番の Quadlet ユニットはホスト側で 127.0.0.1:80 のまま)。
      - "${REDMINE_WEB_BIND_HOST:-127.0.0.1}:${REDMINE_WEB_HOST_PORT:-8080}:${REDMINE_WEB_CONTAINER_PORT:-80}"
    depends_on:
      redmine-db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_RELATIVE_URL_ROOT: ${REDMINE_SUBURI:-/redmine}
      TZ: ${TZ:-Asia/Tokyo}
      REDMINE_DB_HOST: ${REDMINE_DB_CONTAINER:-redmine-db}
      REDMINE_DB_NAME: ${REDMINE_DB_NAME:-redmine}
      REDMINE_DB_USER: ${REDMINE_DB_USER:-redmine}
      REDMINE_DB_PASSWORD_FILE: /run/secrets/db_password
      REDMINE_SECRET_KEY_BASE_FILE: /run/secrets/secret_key_base
      REDMINE_PLUGINS_MIGRATE: "1"
      # 公式イメージ同様、値を設定するとコアの db:migrate をスキップします
      # （既定は未設定 = 起動時にマイグレーションを実行）。
      # REDMINE_NO_DB_MIGRATE: "1"
    secrets:
      - db_password
      - secret_key_base
    volumes:
      - redmine_files:/usr/src/redmine/files
    healthcheck:
      test: ["CMD-SHELL", 'apache_ok=0; puma_ok=0; curl -f -s "http://localhost${REDMINE_SUBURI:-/redmine}/login" > /dev/null && apache_ok=1 || echo "Apache healthcheck failed"; curl -f -s "http://127.0.0.1:${REDMINE_PUMA_PORT:-3000}${REDMINE_SUBURI:-/redmine}/login" > /dev/null && puma_ok=1 || echo "Puma healthcheck failed"; [ "$$apache_ok" -eq 1 ] && [ "$$puma_ok" -eq 1 ]']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
