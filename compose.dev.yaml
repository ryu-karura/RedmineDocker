# compose.dev.yaml — 開発環境専用
#
# redmine Redmine スタック用の Docker Compose 定義です。production の Podman Quadlet
# ユニット (quadlets/) と同じイメージ・環境変数・シークレット・ヘルスチェックを使いますが、
# /opt/redmine のホスト bind-mount ではなく名前付きボリュームを使うため、ホスト準備なしで
# 実行できます。
#
# 本番デプロイではこのファイルは使用せず、docs/Setup.md で説明する Podman + systemd
# Quadlets を使います。
#
# 設定値 (コンテナ名・DB名・ユーザー名・SUB URI・ポートなど) は下の ${VAR:-default} が
# ./.env から読み込まれます（Compose の標準機能）。.env を置かなければ既定値がそのまま
# 使われるので、カスタマイズしたい場合だけ .env.example をコピーしてください。
# 一覧と、本番 Quadlet 側に反映されない理由は docs/Design.md の「設定項目」章を参照。
#
# 使い方:
#   bash scripts/generate-secrets.sh          # ./secrets/*.txt を生成
#   docker compose -f compose.dev.yaml up --build -d
#   http://localhost:8080/redmine/ を開く

name: redmine

networks:
  redmine-net:
    name: ${NETWORK_NAME:-redmine-net}
    driver: bridge

volumes:
  pgdata:
  redmine_files:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  secret_key_base:
    file: ./secrets/secret_key_base.txt

services:
  # ── PostgreSQL 18 + PostGIS 3.6 ──────────────────────────────────────────────
  redmine-db:
    build:
      context: containers/redmine-db
      dockerfile: Containerfile
    image: localhost/redmine-db:18-3.6
    container_name: ${DB_CONTAINER_NAME:-redmine-db}
    restart: always
    networks:
      - redmine-net
    # ポート 5432 は意図的にホストへ公開しません。
    environment:
      POSTGRES_DB: ${DB_NAME:-redmine}
      POSTGRES_USER: ${DB_USER:-redmine}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-redmine} -h localhost -d ${DB_NAME:-redmine} -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redmine 6.1.3 + Apache 2.4 frontend (port 80 / :3000) ─────────────────
  redmine-web:
    build:
      context: containers/redmine-web
      dockerfile: Containerfile
    image: localhost/redmine-web:6.1.3
    container_name: ${WEB_CONTAINER_NAME:-redmine-web}
    restart: always
    networks:
      - redmine-net
    ports:
      # ループバックのみ、非特権ポート (既定 8080) で公開します。rootless Podman は
      # 特権ポート (<1024) への bind に CAP_NET_BIND_SERVICE ないし
      # net.ipv4.ip_unprivileged_port_start の変更を要求するため、ホスト準備
      # なしで動く開発環境ではホスト側を 8080 にマッピングします
      # (本番の Quadlet ユニットはホスト側で 127.0.0.1:80 のまま、意図的な相違)。
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    depends_on:
      redmine-db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_RELATIVE_URL_ROOT: ${RAILS_RELATIVE_URL_ROOT:-/redmine}
      TZ: ${TZ:-Asia/Tokyo}
      # NOTE: this must stay the fixed Compose *service* key (below, under
      # `services:`), not ${DB_CONTAINER_NAME} — that only renames the
      # container's cosmetic display name, while the service key is what
      # Compose actually guarantees as the cross-container DNS hostname.
      REDMINE_DB_HOST: redmine-db
      REDMINE_DB_NAME: ${DB_NAME:-redmine}
      REDMINE_DB_USER: ${DB_USER:-redmine}
      REDMINE_DB_PASSWORD_FILE: /run/secrets/db_password
      REDMINE_SECRET_KEY_BASE_FILE: /run/secrets/secret_key_base
      REDMINE_PLUGINS_MIGRATE: "1"
    secrets:
      - db_password
      - secret_key_base
    volumes:
      - redmine_files:/usr/src/redmine/files
    healthcheck:
      test: ["CMD-SHELL", 'apache_ok=0; puma_ok=0; curl -f -s http://localhost${RAILS_RELATIVE_URL_ROOT:-/redmine}/login > /dev/null && apache_ok=1 || echo "Apache healthcheck failed"; curl -f -s http://127.0.0.1:3000${RAILS_RELATIVE_URL_ROOT:-/redmine}/login > /dev/null && puma_ok=1 || echo "Puma healthcheck failed"; [ "$$apache_ok" -eq 1 ] && [ "$$puma_ok" -eq 1 ]']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
