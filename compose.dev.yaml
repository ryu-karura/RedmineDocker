# compose.dev.yaml — 開発環境専用
#
# redmine Redmine スタック用の Docker Compose 定義です。production の Podman Quadlet
# ユニット (quadlets/) と同じイメージ・環境変数・シークレット・ヘルスチェックを使いますが、
# /opt/redmine のホスト bind-mount ではなく名前付きボリュームを使うため、ホスト準備なしで
# 実行できます。
#
# 本番デプロイではこのファイルは使用せず、docs/Setup.md で説明する Podman + systemd
# Quadlets を使います。
#
# 使い方:
#   bash scripts/generate-secrets.sh          # ./secrets/*.txt を生成
#   docker compose -f compose.dev.yaml up --build -d
#   http://localhost/redmine/ を開く        # （または host Apache 経由: http://localhost/redmine/）

name: redmine

networks:
  redmine-net:
    name: redmine-net
    driver: bridge

volumes:
  pgdata:
  redmine_files:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  secret_key_base:
    file: ./secrets/secret_key_base.txt

services:
  # ── PostgreSQL 18 + PostGIS 3.6 ──────────────────────────────────────────────
  redmine-db:
    build:
      context: containers/redmine-db
      dockerfile: Containerfile
    image: localhost/redmine-db:18-3.6
    container_name: redmine-db
    restart: always
    networks:
      - redmine-net
    # ポート 5432 は意図的にホストへ公開しません。
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redmine 6.1.3 + Apache 2.4 frontend (port 80 / :3000) ─────────────────
  redmine-web:
    build:
      context: containers/redmine-web
      dockerfile: Containerfile
    image: localhost/redmine-web:6.1.3
    container_name: redmine-web
    restart: always
    networks:
      - redmine-net
    ports:
      # ループバックのみ公開します。ホスト Apache が :80/redmine → ここへ転送します。
      - "127.0.0.1:80:80"
    depends_on:
      redmine-db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_RELATIVE_URL_ROOT: /redmine
      TZ: Asia/Tokyo
      REDMINE_DB_HOST: redmine-db
      REDMINE_DB_NAME: redmine
      REDMINE_DB_USER: redmine
      REDMINE_DB_PASSWORD_FILE: /run/secrets/db_password
      REDMINE_SECRET_KEY_BASE_FILE: /run/secrets/secret_key_base
      REDMINE_PLUGINS_MIGRATE: "1"
    secrets:
      - db_password
      - secret_key_base
    volumes:
      - redmine_files:/usr/src/redmine/files
    healthcheck:
      test: ["CMD-SHELL", 'apache_ok=0; puma_ok=0; curl -f -s http://localhost/redmine/login > /dev/null && apache_ok=1 || echo "Apache healthcheck failed"; curl -f -s http://127.0.0.1:3000/redmine/login > /dev/null && puma_ok=1 || echo "Puma healthcheck failed"; [ "$$apache_ok" -eq 1 ] && [ "$$puma_ok" -eq 1 ]']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
