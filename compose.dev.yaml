# compose.dev.yaml — DEVELOPMENT ONLY
#
# Docker Compose definition for running the Redmine stack in GitHub
# Codespaces or on any machine with Docker. It mirrors the production
# Podman Quadlet units in quadlets/ (same images, same environment
# variables, same health checks) but uses named volumes instead of the
# /opt/redmine host bind-mounts so it runs without host preparation.
#
# Production deployment does NOT use this file — it uses Podman +
# systemd Quadlets as described in docs/Setup.md.
#
# Usage:
#   bash scripts/generate-env.sh              # creates ./.env
#   docker compose -f compose.dev.yaml up --build -d
#   open http://localhost:10080/redmine

name: redminedocker-dev

services:
  redmine-db:
    build:
      context: containers/redmine-db
      dockerfile: Containerfile
    image: localhost/redmine-db:18-master
    container_name: redmine-db
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - redmine_net

  redmine-prod:
    build:
      context: containers/redmine-prod
      dockerfile: Containerfile
    image: localhost/redmine-prod:6.1.3
    container_name: redmine-prod
    env_file: .env
    environment:
      RAILS_ENV: production
      RAILS_RELATIVE_URL_ROOT: /redmine
      REDMINE_DB_HOST: redmine-db
      REDMINE_DB_NAME: redmine_prod
      REDMINE_DB_USER: redmine_adm
    ports:
      - "10080:80"
    depends_on:
      redmine-db:
        condition: service_healthy
    volumes:
      - redmine_files:/opt/redmine/app/files
      - redmine_log:/opt/redmine/app/log
      - redmine_assets:/opt/redmine/app/public/assets
      - redmine_plugin_assets:/opt/redmine/app/public/plugin_assets
      - redmine_tmp:/opt/redmine/app/tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost/redmine/login > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - redmine_net

networks:
  redmine_net:
    name: redmine_net

volumes:
  pgdata:
  redmine_files:
  redmine_log:
  redmine_assets:
  redmine_plugin_assets:
  redmine_tmp:
