# host-apache/redmine-proxy.conf
#
# Apache reverse proxy configuration for the host machine.
# Place at: /etc/httpd/conf.d/redmine-proxy.conf
#
# Requires these modules (verify with: httpd -M):
#   proxy_module, proxy_http_module, ssl_module, headers_module,
#   alias_module, rewrite_module, setenvif_module
#
# Replace the following placeholders before deploying:
#   YOUR_HOSTNAME     — the server's FQDN (e.g., redmine.example.com)
#   /path/to/cert.crt — absolute path to TLS certificate
#   /path/to/cert.key — absolute path to TLS private key
#   /path/to/chain.crt — intermediate CA chain (omit if not applicable)

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName YOUR_HOSTNAME
    RewriteEngine On
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

# ── HTTPS Virtual Host ────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName YOUR_HOSTNAME
    ServerAdmin admin@YOUR_HOSTNAME

    # ── TLS configuration ─────────────────────────────────────────────────────
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    SSLCertificateFile      /path/to/cert.crt
    SSLCertificateKeyFile   /path/to/cert.key
    # SSLCertificateChainFile /path/to/chain.crt

    # ── Security headers ──────────────────────────────────────────────────────
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "SAMEORIGIN"
    Header always set X-XSS-Protection          "1; mode=block"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"

    # ── IP spoofing protection for redmine_ip_filter ──────────────────────────
    # Strip any incoming X-Forwarded-For to prevent spoofing, then set the
    # real client IP from REMOTE_ADDR. The redmine_ip_filter plugin reads
    # X-Forwarded-For via ActionDispatch::RemoteIp.
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # ── Proxy settings ────────────────────────────────────────────────────────
    ProxyRequests Off
    ProxyPreserveHost On

    # ──────────────────────────────────────────────────────────────────────────
    # PRODUCTION ENVIRONMENT: /redmine → Container 1 (port 10080)
    # ──────────────────────────────────────────────────────────────────────────

    # Serve static files directly from the host bind-mount paths
    # This bypasses the container entirely for static content, improving performance.
    Alias /redmine/files          /opt/redmine/data/redmine1/files
    Alias /redmine/assets         /opt/redmine/data/redmine1/public/assets
    Alias /redmine/plugin_assets  /opt/redmine/data/redmine1/public/plugin_assets

    <Directory /opt/redmine/data/redmine1/files>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /opt/redmine/data/redmine1/public/assets>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Directory /opt/redmine/data/redmine1/public/plugin_assets>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=86400"
    </Directory>

    # Proxy dynamic requests to Container 1 (Apache inside container)
    ProxyPass /redmine/files           !
    ProxyPass /redmine/assets          !
    ProxyPass /redmine/plugin_assets   !
    ProxyPass        /redmine  http://127.0.0.1:10080/redmine
    ProxyPassReverse /redmine  http://127.0.0.1:10080/redmine

    # ── Logging ───────────────────────────────────────────────────────────────
    ErrorLog  /var/log/httpd/redmine_error.log
    CustomLog /var/log/httpd/redmine_access.log combined

    # Do not log static asset requests (high volume, low value)
    SetEnvIf Request_URI "^/redmine/assets/"         dontlog
    SetEnvIf Request_URI "^/redmine/plugin_assets/"  dontlog
    CustomLog /var/log/httpd/redmine_access.log combined env=!dontlog

</VirtualHost>
