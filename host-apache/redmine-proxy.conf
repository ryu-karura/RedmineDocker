# host-apache/redmine-proxy.conf
#
# ホスト（AlmaLinux9 / RHEL9）向け Apache リバースプロキシ設定です。
# 配置先: /etc/httpd/conf.d/redmine-proxy.conf
#
# 必要モジュール（httpd -M で確認）:
#   proxy_module, proxy_http_module, ssl_module, headers_module, rewrite_module
#
# ホスト Apache は 443 で TLS 終端し、Redmine サブ URI を
# 127.0.0.1:80 公開の redmine-web コンテナへ転送します。
# redmine-web は内部 Puma へ転送し、/redmine 配下で
# 静的資産を含む Redmine 本体を配信します。
#
# デプロイ前に次のプレースホルダを置換してください:
#   YOUR_HOSTNAME     — サーバー FQDN（例: redmine.example.com）
#   /path/to/cert.crt — TLS 証明書の絶対パス
#   /path/to/cert.key — TLS 秘密鍵の絶対パス
#   /path/to/chain.crt — 中間 CA チェーン（不要なら省略）

# ── HTTP → HTTPS リダイレクト ────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName YOUR_HOSTNAME
    RewriteEngine On
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

# ── HTTPS VirtualHost ─────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName YOUR_HOSTNAME
    ServerAdmin admin@YOUR_HOSTNAME

    # ── TLS 設定 ──────────────────────────────────────────────────────────────
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    SSLCertificateFile      /path/to/cert.crt
    SSLCertificateKeyFile   /path/to/cert.key
    # SSLCertificateChainFile /path/to/chain.crt

    # ── セキュリティヘッダー ───────────────────────────────────────────────────
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "SAMEORIGIN"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"

    # ── redmine_ip_filter 向け IP なりすまし対策 ──────────────────────────────
    # 受信した X-Forwarded-For は一旦破棄し、実クライアント IP を再設定します。
    # コンテナ側プロキシ（redmine-web）はこの値を下流へ保持します。
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-For   "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # ── redmine-web コンテナ（loopback :80）へプロキシ ──────────────────────
    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass        /redmine  http://127.0.0.1:80/redmine
    ProxyPassReverse /redmine  http://127.0.0.1:80/redmine

    # ── ログ ──────────────────────────────────────────────────────────────────
    ErrorLog  /var/log/httpd/redmine_error.log

    # 静的資産リクエストはログ抑制（高頻度・低価値）
    SetEnvIf Request_URI "^/redmine/assets/"         dontlog
    SetEnvIf Request_URI "^/redmine/plugin_assets/"  dontlog
    CustomLog /var/log/httpd/redmine_access.log combined env=!dontlog
</VirtualHost>
