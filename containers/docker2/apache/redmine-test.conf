# containers/docker2/apache/redmine-test.conf
#
# Apache virtual host for the plugin verification environment (sub-URI: /redmine-test)

<VirtualHost *:80>
    ServerName localhost

    Alias /redmine-test/files         /opt/redmine/app/files
    <Directory /opt/redmine/app/files>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    Alias /redmine-test/assets        /opt/redmine/app/public/assets
    <Directory /opt/redmine/app/public/assets>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    Alias /redmine-test/plugin_assets /opt/redmine/app/public/plugin_assets
    <Directory /opt/redmine/app/public/plugin_assets>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=86400"
    </Directory>

    ProxyPass /redmine-test/files           !
    ProxyPass /redmine-test/assets          !
    ProxyPass /redmine-test/plugin_assets   !

    ProxyPass        /redmine-test  unix:/opt/redmine/app/tmp/puma.sock|http://localhost/redmine-test
    ProxyPassReverse /redmine-test  unix:/opt/redmine/app/tmp/puma.sock|http://localhost/redmine-test

    Header unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

</VirtualHost>
