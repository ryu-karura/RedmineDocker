# containers/docker3/apache/redmine-next.conf
#
# Apache virtual host for the version upgrade test environment (sub-URI: /redmine-next)

<VirtualHost *:80>
    ServerName localhost

    Alias /redmine-next/files         /opt/redmine/app/files
    <Directory /opt/redmine/app/files>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    Alias /redmine-next/assets        /opt/redmine/app/public/assets
    <Directory /opt/redmine/app/public/assets>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    Alias /redmine-next/plugin_assets /opt/redmine/app/public/plugin_assets
    <Directory /opt/redmine/app/public/plugin_assets>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=86400"
    </Directory>

    ProxyPass /redmine-next/files           !
    ProxyPass /redmine-next/assets          !
    ProxyPass /redmine-next/plugin_assets   !

    ProxyPass        /redmine-next  unix:/opt/redmine/app/tmp/puma.sock|http://localhost/redmine-next
    ProxyPassReverse /redmine-next  unix:/opt/redmine/app/tmp/puma.sock|http://localhost/redmine-next

    Header unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

</VirtualHost>
