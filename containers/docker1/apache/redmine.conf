# containers/docker1/apache/redmine.conf
#
# Apache virtual host configuration for Redmine production (sub-URI: /redmine)
# inside Docker1 container.
#
# This configuration:
#   1. Serves Redmine's static assets (files, CSS, JS) directly from the filesystem
#      to minimize load on the Puma application server.
#   2. Proxies all other requests to Puma via Unix domain socket.
#
# The REDMINE_SUBURI environment variable is set to /redmine in the Containerfile.

<VirtualHost *:80>
    ServerName localhost

    # ── Static file serving (bypass Puma) ────────────────────────────────────
    # Uploaded files (attachments)
    Alias /redmine/files /opt/redmine/app/files
    <Directory /opt/redmine/app/files>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    # Compiled CSS/JS assets (Sprockets output)
    Alias /redmine/assets /opt/redmine/app/public/assets
    <Directory /opt/redmine/app/public/assets>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        # Long-lived cache headers for fingerprinted assets
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Plugin static assets
    Alias /redmine/plugin_assets /opt/redmine/app/public/plugin_assets
    <Directory /opt/redmine/app/public/plugin_assets>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=86400"
    </Directory>

    # Favicon and robots.txt at the Redmine sub-path
    Alias /redmine/favicon.ico /opt/redmine/app/public/favicon.ico
    Alias /redmine/robots.txt  /opt/redmine/app/public/robots.txt

    # ── Proxy dynamic requests to Puma ───────────────────────────────────────
    # Exclude static paths from proxying
    ProxyPass /redmine/files           !
    ProxyPass /redmine/assets          !
    ProxyPass /redmine/plugin_assets   !
    ProxyPass /redmine/favicon.ico     !
    ProxyPass /redmine/robots.txt      !

    # Proxy all other /redmine requests to Puma unix socket
    # Syntax: unix:/path/to/socket|http://localhost/prefix
    ProxyPass        /redmine  unix:/opt/redmine/app/tmp/puma.sock|http://localhost/redmine
    ProxyPassReverse /redmine  unix:/opt/redmine/app/tmp/puma.sock|http://localhost/redmine

    # ── Security headers ──────────────────────────────────────────────────────
    # Prevent Apache from revealing the Puma backend in responses
    Header unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    # ── Logging ───────────────────────────────────────────────────────────────
    # Container stdout/stderr → systemd journal
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

</VirtualHost>
