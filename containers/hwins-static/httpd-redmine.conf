# containers/hwins-static/httpd-redmine.conf
#
# Reverse-proxy virtual host for the hwins-static container. Included from the
# base image's conf/httpd.conf. Publishes the Redmine sub-URI (/redmine) and
# forwards all requests to hwins-redmine's Puma on TCP :3000.

# Quiet the "could not reliably determine the server's fully qualified domain
# name" warning and suppress version disclosure.
ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost

    ProxyRequests Off
    ProxyPreserveHost On

    # Tell Redmine the request arrived over the front proxy. mod_proxy_http
    # automatically appends this hop to X-Forwarded-For, so redmine_ip_filter
    # still sees the client address forwarded by the host Apache in front.
    RequestHeader set X-Forwarded-Proto "http"

    # Convenience: send bare / to the Redmine sub-URI.
    RedirectMatch ^/$ /redmine/

    # Forward the Redmine sub-URI to Puma. Redmine serves its own static assets
    # (CSS/JS/themes) on this port.
    ProxyPass        /redmine  http://hwins-redmine:3000/redmine
    ProxyPassReverse /redmine  http://hwins-redmine:3000/redmine

    # ── Security headers ──────────────────────────────────────────────────────
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options        "SAMEORIGIN"
    Header always set Referrer-Policy         "strict-origin-when-cross-origin"

    # ── Logging → container stdout/stderr ─────────────────────────────────────
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
