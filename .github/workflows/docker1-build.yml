name: Docker1 Build

on:
  push:
    branches:
      - main
    paths:
      - 'containers/docker1/**'
      - '.github/workflows/docker1-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'containers/docker1/**'
      - '.github/workflows/docker1-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Docker1 (Redmine 6.1.3)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker1 image
        uses: docker/build-push-action@v6
        with:
          context: containers/docker1
          file: containers/docker1/Containerfile
          push: false
          tags: redmine-prod:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
